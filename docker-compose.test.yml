services:
  # 1. จักรวาลจำลอง: Test Database (สะอาด 100%)
  test_db:
    image: postgres:16-alpine
    container_name: classroom_test_postgres
    environment:
      POSTGRES_USER: test_admin
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_smte_bot_db
    ports:
      # 🔒 ผูกกับ 127.0.0.1 เท่านั้น (แก้ 2026-09-26) — เดิมเป็น "5433:5432" ซึ่งผูกกับ 0.0.0.0
      #    ⇒ เปิดให้เข้าจากอินเทอร์เน็ตได้ และ **ufw กันไม่ได้** เพราะ Docker ใส่กฎ iptables
      #    ของตัวเองใน DOCKER chain ซึ่งถูกประเมินก่อนกฎของ ufw (เครื่องนี้ไม่มี
      #    /etc/docker/daemon.json ⇒ ใช้ค่า default คือ docker คุม iptables เอง)
      #
      #    ทำไมอันตราย: `POSTGRES_USER: test_admin` ของ image ทางการถูกสร้างเป็น **superuser**
      #    ⇒ ใครต่อติดก็สั่ง `COPY ... FROM PROGRAM` เพื่อรันคำสั่ง shell ในคอนเทนเนอร์ได้ (RCE)
      #    (ประเมินแล้วความเสียหายจำกัด — DB ว่าง · ไม่มี bind mount จาก host ·
      #     อยู่บน network `classroom-management_default` แยกจาก production ⇒ ไม่ทะลุถึงข้อมูลจริง
      #     แต่ก็เป็นประตูที่ไม่จำเป็นต้องเปิดเลย)
      #
      #    test_runner ต่อผ่าน `test_db:5432` บน compose network อยู่แล้ว **ไม่ได้ใช้พอร์ตนี้**
      #    ⇒ ผูก loopback ยังคงความสะดวกเดิม (ต่อจากเครื่อง host ได้ที่ localhost:5433)
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_admin -d test_smte_bot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. เครื่องจักรสังหาร: ตัวรัน Pytest
  test_runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: classroom_test_runner
    user: "root"
    volumes:
      - ./backend:/app:z
      # 🔗 เปิดให้เทสต์ `test_health_check.py::test_swarm_healthcheck_is_wired_to_the_503`
      #    อ่าน healthcheck ของ backend ได้ — ไฟล์ compose อยู่ที่ราก repo ซึ่ง **ไม่ได้**
      #    ถูกเมานต์เข้าไป (มีแค่ ./backend → /app) ⇒ ถ้าไม่เมานต์บรรทัดนี้ เทสต์นั้นจะ skip
      #    ตลอดกาล แล้วคำรับประกันว่า "503 ถูกใช้จริง" ก็หายไปเงียบ ๆ
      #    เมานต์แบบอ่านอย่างเดียว (ro) — เทสต์ต้องไม่แก้ไฟล์ deploy
      - ./docker-compose.app.yml:/repo/docker-compose.app.yml:ro
    environment:
      # 🚨 OVERRIDE DATABASE_URL ให้ชี้มาที่ Test DB ตัวนี้แทน!
      - DATABASE_URL=postgresql://test_admin:test_password@test_db:5432/test_smte_bot_db
      - API_KEY=test-api-key-1234
      - SECRET_KEY=test-secret
      - JWT_SECRET=test-jwt-secret
      - SUPER_ADMIN_ID=999999999999999
      # 🚨 Redis ต้องระบุชัด (ตอนนี้ core/config.py บังคับแล้ว) — เทส mock ActionService อยู่แล้ว ไม่ได้เชื่อมจริง
      - REDIS_URL=redis://127.0.0.1:6379/15
      # 👇 ป้อนของปลอมเพื่อปิดปาก Pydantic (อิงตัวแปรตาม .env ของมึง)
      - DISCORD_CLIENT_ID=dummy_discord_id
      - DISCORD_CLIENT_SECRET=dummy_discord_secret
      - DISCORD_REDIRECT_URI=http://localhost/dummy_discord_callback
      - GOOGLE_CLIENT_ID=dummy_google_id
      - GOOGLE_CLIENT_SECRET=dummy_google_secret
      - GOOGLE_REDIRECT_URI=http://localhost/dummy_google_callback
      - PYTHONPATH=/app
    entrypoint: ["/bin/sh","-c", "export PYTHONDONTWRITEBYTECODE=1 && python -m pip install --no-cache-dir pytest pytest-asyncio httpx && exec \"$@\"", "test_runner"]
    command: ["pytest", "/app/tests", "-v"]
    depends_on:
      test_db:
        condition: service_healthy
