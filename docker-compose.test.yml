services:
  # 1. จักรวาลจำลอง: Test Database (สะอาด 100%)
  test_db:
    image: postgres:16-alpine
    container_name: classroom_test_postgres
    environment:
      POSTGRES_USER: test_admin
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_smte_bot_db
    ports:
      - "5433:5432" # ใช้พอร์ต 5433 จะได้ไม่ชนกับ DB หลักที่รันอยู่
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_admin -d test_smte_bot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. เครื่องจักรสังหาร: ตัวรัน Pytest
  test_runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: classroom_test_runner
    user: "root"
    volumes:
      - ./backend:/app:z
    environment:
      # 🚨 OVERRIDE DATABASE_URL ให้ชี้มาที่ Test DB ตัวนี้แทน!
      - DATABASE_URL=postgresql://test_admin:test_password@test_db:5432/test_smte_bot_db
      - API_KEY=test-api-key-1234
      - SECRET_KEY=test-secret
      - JWT_SECRET=test-jwt-secret
      - SUPER_ADMIN_ID=999999999999999
      # 🚨 Redis ต้องระบุชัด (ตอนนี้ core/config.py บังคับแล้ว) — เทส mock ActionService อยู่แล้ว ไม่ได้เชื่อมจริง
      - REDIS_URL=redis://127.0.0.1:6379/15
      # 👇 ป้อนของปลอมเพื่อปิดปาก Pydantic (อิงตัวแปรตาม .env ของมึง)
      - DISCORD_CLIENT_ID=dummy_discord_id
      - DISCORD_CLIENT_SECRET=dummy_discord_secret
      - DISCORD_REDIRECT_URI=http://localhost/dummy_discord_callback
      - GOOGLE_CLIENT_ID=dummy_google_id
      - GOOGLE_CLIENT_SECRET=dummy_google_secret
      - GOOGLE_REDIRECT_URI=http://localhost/dummy_google_callback
      - PYTHONPATH=/app
    entrypoint: ["/bin/sh","-c", "export PYTHONDONTWRITEBYTECODE=1 && python -m pip install --no-cache-dir pytest pytest-asyncio httpx && exec \"$@\"", "test_runner"]
    command: ["pytest", "/app/tests", "-v"]
    depends_on:
      test_db:
        condition: service_healthy
