# /docker-compose.infra.yml
version: "3.8"
services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - ${ENV_NAME}_postgres_data:/var/lib/postgresql/data
    networks:
      - shared_network
    deploy:
      replicas: 1

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ${ENV_NAME}_redis_data:/data
    networks:
      - shared_network
    deploy:
      replicas: 1
    
  # เปลี่ยนจาก adminer เป็น bytebase
  bytebase:
    image: bytebase/bytebase:latest
    command: ["--data", "/var/opt/bytebase", "--port", "5678"]
    volumes:
      - ${ENV_NAME}_bytebase_data:/var/opt/bytebase
    networks:
      - shared_network
      - traefik-public
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${ENV_NAME}_bytebase.rule=Host(`db-${ENV_NAME}.singto1597.xyz`)" 
        - "traefik.http.services.${ENV_NAME}_bytebase.loadbalancer.server.port=5678"
        - "traefik.docker.network=traefik-public"

volumes:
  staging_postgres_data:
  production_postgres_data:
  staging_redis_data:
  production_redis_data:
  staging_bytebase_data:
  production_bytebase_data:

networks:
  shared_network:
    name: app-internal-${ENV_NAME}
    external: true
  traefik-public:
    external: true