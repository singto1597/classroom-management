version: "3.8"

services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - ${ENV_NAME}_postgres_data:/var/lib/postgresql/data
    networks:
      - app-internal-${ENV_NAME}
    deploy:
      replicas: 1

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ${ENV_NAME}_redis_data:/data
    networks:
      - app-internal-${ENV_NAME}
    deploy:
      replicas: 1

volumes:
  staging_postgres_data:
  production_postgres_data:
  staging_redis_data:
  production_redis_data:

networks:
  app-internal-staging:
    external: true
  app-internal-production:
    external: true