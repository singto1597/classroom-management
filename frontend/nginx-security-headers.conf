# ═══════════════════════════════════════════════════════════════════════════════
# 🛡️ Security headers ของ frontend (P6.4)
# ═══════════════════════════════════════════════════════════════════════════════
# ไฟล์นี้ถูก `include` จาก `nginx.default.conf` **ทั้งใน `server {}` และในทุก
# `location {}`** — ไม่ใช่ความซ้ำซ้อนโดยประมาท แต่เป็นข้อบังคับของ nginx:
#
#   🔴 nginx `add_header` **สืบทอดจากระดับบนก็ต่อเมื่อระดับนั้นไม่มี `add_header`
#      ของตัวเองเลย** (all-or-nothing ไม่ใช่ merge) ⇒ `location /assets/ { add_header
#      Cache-Control …; }` จะ **ไม่ได้** security headers จาก `server {}` เลย
#      ถ้าไม่ได้ `include` ในตัวมันเอง
#
# ⇒ วิธีที่ถูกคือ `include` ในทุกบล็อกที่มี `add_header` และใน `server {}` ด้วย
#   (เผื่อ location ที่เพิ่มมาภายหลังแล้วไม่ได้ใส่ `add_header`) — CI
#   (`ci-compose.yml`) ตรวจข้อนี้ทุก `location` ให้อัตโนมัติ
#
# ─────────────────────────────────────────────────────────────────────────────
# values ที่ตั้งใจ และเหตุผล
# ─────────────────────────────────────────────────────────────────────────────
# X-Content-Type-Options: nosniff
#   ห้ามเบราว์เซอร์เดา MIME — ไฟล์อัปโหลด/Discord export ที่ใช้ร่วมโดเมนจะไม่ถูก
#   ตีความเป็น HTML/JS (คู่กับการ escape ฝั่งหน้าใน utils/html.ts)
#
# X-Frame-Options: DENY  (คู่กับ CSP frame-ancestors 'none')
#   ระบบนี้ไม่มีหน้าที่ตั้งใจให้ฝังใน iframe ⇒ กัน clickjacking ทั้งหมด
#   (Safari เก่ายังไม่รู้จัก frame-ancestors จึงต้องมีทั้งคู่)
#
# Referrer-Policy: strict-origin-when-cross-origin
#   ส่ง Referer เฉพาะ origin เมื่อข้ามโดเมน — ลิงก์แชร์กิจกรรมที่มี token อยู่บน
#   path/query จะไม่รั่วไปยังเว็บปลายทาง (ลิงก์ภายในค่ายังส่ง path เต็มได้)
#
# Permissions-Policy
#   `camera=(self)` — เปิดเฉพาะหน้าเว็บเรา (เครื่องสแกน QR ใช้กล้อง)
#   ที่เหลือปิดทั้งหมด — ไม่มีฟีเจอร์ไหนใช้ และการปิดทำให้ถ้ามีโค้ดแปลกปลอม
#   หลุดเข้ามาก็เรียกของพวกนี้ไม่ได้
#
# Content-Security-Policy-Report-Only
#   **ยังไม่บังคับใช้ (report-only) โดยเจตนา** — ดูเหตุผลใต้ directive แต่ละตัว
#   เมื่อเปิด report-only เบราว์เซอร์จะ *ไม่บล็อก* อะไรเลย แต่รายงานการละเมิด
#   ไปที่ console (ยังไม่มี endpoint รับรายงาน ⇒ ไม่ส่งไปไหน)
#   ⇒ เปิดดูก่อนหนึ่งรอบ แล้วค่อยเปลี่ยนชื่อ header เป็น `Content-Security-Policy`
#
# ─────────────────────────────────────────────────────────────────────────────
# CSP — ทำไมแต่ละ directive ถึงเป็นค่านี้
# ─────────────────────────────────────────────────────────────────────────────
# default-src 'self'          ค่าเริ่มต้น: ทุกอย่างต้องมาจากโดเมนเรา
# script-src 'self'           Vite build ผลิต <script type="module" src="/assets/...">
#                             ทั้งหมด ⇒ ไม่ต้องมี 'unsafe-inline'
#                             ⚠️ `<script type="application/ld+json">` ใน index.html
#                                **ไม่ใช่สคริปต์ที่รัน** (ไม่ใช่ JS) ⇒ CSP ไม่ครอบ และ
#                                ไม่ต้องใส่ hash/nonce ให้มัน
# style-src 'self' 'unsafe-inline' https://fonts.googleapis.com
#                             'unsafe-inline' จำเป็นเพราะ Vue ผูก `:style="…"` เป็น
#                             style attribute (เช่นความกว้างแถบความคืบหน้า) ซึ่ง CSP
#                             จัดอยู่กลุ่ม style-src · Google Fonts เป็น <link rel=stylesheet>
# font-src 'self' https://fonts.gstatic.com
#                             ไฟล์ฟอนต์ที่ CSS ของ Google ชี้ไป
# img-src 'self' data: blob: https:
#                             `https:` เปิดกว้างโดยเจตนา — ช่อง "ลิงก์สลิปโอนเงิน" ให้ผู้ใช้
#                             วาง URL ภายนอก (LINE CDN ฯลฯ) และ URL เปลี่ยนได้ตลอด
#                             ⇒ ล็อกโดเมนไม่ได้ แต่ยังกัน `http:` และ `javascript:`
# connect-src 'self' https://classapi.singto1597.xyz https://classtestapi.singto1597.xyz
#                             API อยู่คนละ subdomain (production + staging) และ image นี้
#                             ถูกใช้ทั้งสอง stack ⇒ ต้องใส่ทั้งคู่ ไม่งั้นรายงานจะท่วมด้วย
#                             คำขอปกติที่ถูกต้อง
#                             ⚠️ ถ้าเปลี่ยนโดเมน API ต้องแก้ที่นี่ (report-only ⇒ แค่รายงาน)
# worker-src 'self'           service worker (/sw.js) + worker ที่ Vite สร้าง
# manifest-src 'self'         /manifest.webmanifest
# frame-ancestors 'none'      ห้ามฝังทั้งเว็บใน iframe (คู่กับ X-Frame-Options)
# base-uri 'self'             กัน <base href> ที่ถูก inject เปลี่ยนปลายทางของลิงก์ทั้งหมด
# form-action 'self'          ฟอร์มส่งไปโดเมนอื่นไม่ได้ (OAuth ใช้ redirect ไม่ใช่ form)
# object-src 'none'           ไม่มี <object>/<embed>/<applet> ใช้งาน — ปิดเลย
# ─────────────────────────────────────────────────────────────────────────────

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()" always;

add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://classapi.singto1597.xyz https://classtestapi.singto1597.xyz; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
