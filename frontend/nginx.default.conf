# ═══════════════════════════════════════════════════════════════════════════════
# 🧱 nginx ของ frontend — SPA fallback + แคชที่ถูกต้องสำหรับ PWA
# ═══════════════════════════════════════════════════════════════════════════════
# ⚠️ เดิมไฟล์นี้ถูกสร้างด้วย `RUN echo 'server { … }'` ใน Dockerfile ⇒ แก้ยาก
#    และตรวจ diff ไม่ได้ · ย้ายมาเป็นไฟล์จริงแล้ว (COPY ใน Dockerfile)
#
# กฎแคชสามชั้น — แต่ละชั้นมีเหตุผลของตัวเอง:
#   1. `/sw.js`          no-store  — service worker ต้องอัปเดตทันที ไม่งั้นแอปค้างโค้ดเก่า
#   2. `/assets/*`       immutable — ไฟล์มี hash ในชื่อ (index-<hash>.js) เนื้อหาไม่เปลี่ยน
#   3. `index.html` / อื่น ๆ  no-cache — ต้องได้ตัวใหม่ที่ชี้ hash ของ build ล่าสุดเสมอ
#      (no-cache = เก็บได้แต่ต้อง revalidate ทุกครั้ง — ต่างจาก no-store ที่ห้ามเก็บเลย)
#
# 🔴 อย่าใส่ `expires` ให้ `/assets/` ล่วงหน้าโดยไม่รู้ว่า Vite ใส่ hash ให้ทุกไฟล์ —
#    ถ้ามีไฟล์ที่ไม่มี hash หลุดเข้ามา ผู้ใช้จะค้างเวอร์ชันเก่าตลอดไป

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ไม่ประกาศเวอร์ชัน nginx ใน header `Server:` / หน้า error
    server_tokens off;

    # 🛡️ [P6.4] security headers (nosniff · X-Frame-Options · Referrer-Policy ·
    #    Permissions-Policy · CSP report-only) — ดูเหตุผลรายตัวในไฟล์นั้น
    #
    # 🔴 **ต้อง `include` ซ้ำในทุก `location` ด้านล่างด้วย** เพราะ nginx
    #    สืบทอด `add_header` จากระดับบน *ก็ต่อเมื่อระดับนั้นไม่มี `add_header`
    #    ของตัวเอง* — location ที่ตั้ง Cache-Control จะทิ้ง security headers
    #    ทั้งชุดถ้าไม่ include เอง (ci-compose.yml บังคับข้อนี้ด้วยเทสต์)
    include /etc/nginx/snippets/security-headers.conf;

    # service worker — ห้ามแคชเด็ดขาด
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # manifest — เก็บได้ แต่ต้องเช็คว่ามีของใหม่
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ไฟล์ build ที่มี hash ในชื่อ — แคชได้ตลอดกาล
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # หน้าจอ SPA + ไฟล์ static อื่น
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
