<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>{{ page_title }}</title>
<style>
  /* ══════════════════════════════════════════════════════════════════════
     ฟอนต์ไทยถูกฝังมาเป็น base64 data URI จากฝั่ง backend (pdf.py)
     Gotenberg เรนเดอร์ใน container ของตัวเอง — อ้างไฟล์ในเครื่อง backend ไม่ได้
     ⇒ `f.uri` ถูกฉีดเข้ามาทั้งก้อน (ไฟล์ละ ~45KB) ห้ามย่อ/ตัดทอน

     🔴 หนึ่ง @font-face ต่อหนึ่งไฟล์ (static) — **ห้าม** รวมเป็นตัวเดียวแล้วใส่
        `font-weight: 100 900` กับ variable font: Chromium/Skia embed ลง PDF ไม่ได้
        จะถอยไปวาด glyph เป็น Type 3 แทน (ไฟล์ใหญ่ 5.5 เท่า + ไม่ใช่ TrueType จริง)
        รายละเอียดการทดลองอยู่ใน backend/services/finance/constants.py
     ⚠️ ทุก @font-face ต้องใช้ family name เดียวกัน แล้วแยกด้วย `font-weight`
        ถ้าไม่มีไฟล์ของน้ำหนักที่ใช้ Chromium จะ synthesize ตัวหนาเอง → สระ/วรรณยุกต์เพี้ยน
     ══════════════════════════════════════════════════════════════════════ */
  {% for f in font_faces %}
  @font-face {
    font-family: '{{ font_family }}';
    src: url('{{ f.uri }}') format('truetype');
    font-weight: {{ f.weight }};
    font-style: normal;
    font-display: block;
  }
  {% endfor %}

  @page { size: A4; margin: 0; }

  * { box-sizing: border-box; }

  /* ══════════════════════════════════════════════════════════════════════
     📄 หนึ่งไฟล์มีได้หลายเอกสาร (หน้าละใบ) — `.doc` คือ "หนึ่งใบ"
     🔴 padding ของระยะขอบต้องอยู่ที่ `.doc` **ไม่ใช่ `body`**:
        padding ของ `body` มีผลเฉพาะหน้าแรกและหน้าสุดท้ายของ flow ที่แบ่งหน้า
        ⇒ หน้า 2..N ของไฟล์รวมจะไม่มีขอบเลย (ยื่นชิดขอบกระดาษ)
     🔴 `<style>` ต้องอยู่นอกลูป `documents` — ถ้าย้ายเข้าไป ฟอนต์ (data URI ~61,000
        ตัวอักษร/ไฟล์) จะถูกฝังซ้ำ N เท่า
     ⚠️ และคอมเมนต์นี้ **ห้ามเขียนตัวคำนำหน้า data URI ของฟอนต์ออกมาตรง ๆ** — เทสต์นับ
        จำนวนครั้งของคำนำหน้านั้นใน HTML ทั้งไฟล์ (ต้องได้ 2 = Regular + Bold) ⇒ คอมเมนต์
        ที่เผลอเขียนคำนำหน้าลงไปจะถูกนับเป็นฟอนต์อันที่สาม แล้วเทสต์ล้มทั้งที่โค้ดถูก
     ══════════════════════════════════════════════════════════════════════ */
  body {
    font-family: '{{ font_family }}', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    color: #1c1917;
    margin: 0;
    padding: 0;
  }

  .doc { padding: 14mm 14mm 10mm; }

  /* ขึ้นหน้าใหม่ก่อนเอกสารใบถัดไป — `break-after` คือมาตรฐานปัจจุบัน
     ส่วน `page-break-after` เป็นชื่อเก่าที่ Chromium ยังรองรับ (ใส่ทั้งคู่เพื่อความแน่นอน) */
  .doc-break { break-after: page; page-break-after: always; }

  .head { display: flex; justify-content: space-between; align-items: flex-start; }
  .head h1 { font-size: 19px; margin: 0 0 2px; font-weight: 700; }
  .head .room { font-size: 12px; color: #57534e; }
  .doc-title { text-align: right; }
  .doc-title .label { font-size: 17px; font-weight: 700; }
  .doc-title .no { font-size: 12px; color: #57534e; margin-top: 3px; }

  /* 🚫 เอกสารถูกยกเลิก — ประทับให้เห็นชัดก่อนอ่านรายละเอียดใด ๆ
     ต้องไม่ใช่สีจาง ๆ เพราะใบเสร็จที่ยกเลิกแล้วแต่ดูเหมือนใบปกติ = หลักฐานที่ทำให้เข้าใจผิด */
  .void-banner {
    border: 3px solid #b91c1c; background: #fef2f2; color: #7f1d1d;
    padding: 7px 12px; margin: 0 0 12px; border-radius: 4px;
    font-size: 15px; font-weight: 700; text-align: center; letter-spacing: 0.5px;
  }
  .void-banner .why { display: block; font-size: 11px; font-weight: 400; margin-top: 3px; }

  hr { border: 0; border-top: 2px solid #1c1917; margin: 10px 0 14px; }

  table { width: 100%; border-collapse: collapse; }
  .meta td { padding: 3px 0; vertical-align: top; }
  /* ⚠️ 160px คือความกว้างของป้ายที่ยาวที่สุด ("ยอดเต็มของรายการ" / "ยอดสะสมที่ชำระแล้ว")
     ถ้าแคบกว่านี้ `white-space: nowrap` จะดันป้ายไปชนตัวเลขจนอ่านไม่ออก (เคยพลาดมาแล้ว) */
  .meta .k { color: #57534e; width: 160px; padding-right: 10px; white-space: nowrap; }

  table.items { margin-top: 12px; }
  table.items th, table.items td { padding: 7px 8px; border: 1px solid #d6d3d1; }
  table.items th { background: #f5f5f4; font-weight: 700; text-align: left; }
  table.items td.num, table.items th.num { text-align: right; white-space: nowrap; }
  /* 📋 ใบแจ้งหนี้รวมยอด: วันที่ของแต่ละโครงการ และบรรทัดสรุปที่ถูกตัดออก */
  table.items .due { color: #57534e; font-size: 11px; }
  table.items .more { color: #57534e; font-size: 11px; font-style: italic; }

  /* 💰 ยอดเงิน + คำอ่าน คือหัวใจของเอกสารนี้ — เน้นให้เด่นกว่าอย่างอื่น */
  .amount-box {
    margin-top: 12px;
    border: 2px solid #1c1917;
    padding: 9px 12px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .amount-box .words { font-size: 14px; font-weight: 700; }
  .amount-box .figures { font-size: 18px; font-weight: 700; white-space: nowrap; }

  .note { margin-top: 10px; color: #57534e; font-size: 11.5px; }

  .sign { margin-top: 42px; display: flex; justify-content: space-between; }
  .sign .slot { width: 44%; text-align: center; }
  /* ✍️ [F6] ใบสำคัญจ่ายมี **3 ฝ่าย** (ผู้เบิก · ผู้จ่าย · ผู้อนุมัติ) ส่วนใบเสร็จมี 2
     ⚠️ 44% สามช่อง = 132% ⇒ ช่องที่สามตกขอบกระดาษ · 30% × 3 = 90% เหลือช่องว่างให้เซ็นพอดี
     ⚠️ ชื่อตำแหน่งก็ยาวกว่า ("ผู้จ่ายเงิน (เหรัญญิก)") ⇒ `nowrap` จะดันกันชนกัน อ่านไม่ออก */
  .sign.sign-3 .slot { width: 30%; }
  .sign .line { border-top: 1px dotted #78716c; margin-bottom: 5px; padding-top: 34px; }
  .sign .who { font-size: 12px; }
  .sign .role { font-size: 11px; color: #57534e; }

  .foot { margin-top: 26px; font-size: 10.5px; color: #a8a29e; text-align: center; }
</style>
</head>
<body>
{% for d in documents %}
<div class="doc{% if not loop.last %} doc-break{% endif %}">{#
  🧾 [F6] เนื้อในของ "หนึ่งใบ" แยกเป็น partial ตามชนิดเอกสาร — เทมเพลตนี้ทำหน้าที่แค่
  ถือ `<style>` (ฟอนต์ base64 ต้องอยู่นอกลูป) + กรอบ `.doc` แล้วให้ `_document_context`
  เป็นคนตอบว่าใบนี้ใช้ partial ไหนผ่านคีย์ `body_template`
  🔴 ทำไมไม่ใช้ `{% if %}` สามทางในไฟล์เดียว: เนื้อใน branch ด้วย `is_receipt` ราว 8 จุด
     ซึ่งทุกจุดเป็น "ใบเสร็จ หรือ ใบแจ้งหนี้" ⇒ เพิ่มชนิดที่สาม = ลืมจุดเดียวแล้วพิมพ์
     "เรียกเก็บจาก"/"ยอดค้างชำระ" บนใบสำคัญจ่ายโดยไม่มี error (กับดักใน `docs/skills.md`)
  🔴 `{% include %}</div>` อยู่ **บรรทัดเดียวกัน** โดยเจตนา: ถ้าแยกบรรทัด จะมี "\n" เกิน
     มาหนึ่งตัวต่อหนึ่งใบ ⇒ ไบต์ของใบเดี่ยวเปลี่ยนจาก HEAD (สัญญา "จอตรงกับกระดาษ" พัง)
     และ `_receipt_body.html` ก็ตั้งใจให้ "ไบต์ในไฟล์ = ไบต์ที่ออกจริง" ทุกไบต์
  ⚠️ เขียนตัวปิดคอมเมนต์ตรง ๆ ในข้อความไม่ได้ (จะปิดคอมเมนต์ตรงนี้เลย) — ใช้ "ขีดนำ + ปีกกา"
  #}
{% include d.body_template %}</div>
{% endfor %}
</body>
</html>
