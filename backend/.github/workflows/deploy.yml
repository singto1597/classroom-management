name: Auto Deploy Backend
on:
  push:
    branches: [ main, staging ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Server and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
              echo "🚀 Deploying Backend STAGING..."
              cd ~/classroom-staging/classroom-management_backend
              git pull origin staging
              # รีสตาร์ท Service ตัวเทสที่มึงใช้อยู่
              sudo systemctl restart classroom-api-staging

            elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "🔥 Deploying Backend PRODUCTION..."
              cd ~/classroom-management/classroom-management_backend
              git pull origin main
              # รีสตาร์ท Service ตัวจริง (แก้ชื่อให้ตรงของจริงนะ)
              # sudo systemctl restart classroom-api-production
            fi
