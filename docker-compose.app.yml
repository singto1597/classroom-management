version: "3.8"

services:
  backend:
    # 🚨 ห้ามมี `:-latest` fallback — ดู docs/skills.md "docker stack deploy ที่ไม่ได้ export IMAGE_TAG"
    #    `${IMAGE_TAG:?...}` ทำให้ "ลืม export" = deploy ล้มดัง ๆ แทนที่จะถอยไปรันอิมเมจ `:latest`
    #    ซึ่งในเครื่องนี้อายุ 8 สัปดาห์ ⇒ ระบบดูปกติแต่รันโค้ดย้อนหลังสองเดือน (หาไม่เจอด้วย docker service ls)
    #    ⚠️ ข้อความ error **ห้ามมีเครื่องหมายขีด `-`** (ทดสอบจริง 2026-09-26) — ถ้ามี
    #       docker จะ **ไม่ฟ้อง error** แต่ตัดที่ขีดตัวแรก แล้วเอาข้อความข้างหลังไปเป็นชื่อ tag
    #       เงียบ ๆ ⇒ แย่กว่าเดิม  เช่น "a-b" → tag "b", "run pull-all now" → tag "all now"
    #       (เครื่องหมายคำพูด**ไม่จำเป็น** — `:` `=` `*` `/` `.` เว้นวรรค ใช้ได้หมด
    #        เอกสารเดิมบอกว่าต้องใส่คำพูด ซึ่งผิด แก้แล้วใน docs/skills.md)
    image: classroom-${ENV_NAME}-backend:${IMAGE_TAG:?"IMAGE_TAG is required. Run pull_all.sh first"}
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://${ENV_NAME}_infra_redis:6379/0
      # 🖨️ [F3] Gotenberg — service name จริงบน shared_network (ค่า default ใน config.py
      #    เป็น localhost ซึ่งใช้ได้แค่ตอนเทสต์ ⇒ ถ้าลืมบรรทัดนี้ PDF จะ 502 ทุกครั้ง)
      # ⚠️ stack name = DNS name ⇒ gotenberg ถูกย้ายไป stack `${ENV_NAME}_pdf` แล้ว
      #    (docker-compose.pdf.yml) จึงเป็น `..._pdf_gotenberg` ไม่ใช่ `..._infra_gotenberg`
      - GOTENBERG_URL=http://${ENV_NAME}_pdf_gotenberg:3000
    networks:
      - shared_network
      - traefik-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${ENV_NAME}_backend.rule=Host(`${API_DOMAIN}`)"
        - "traefik.http.services.${ENV_NAME}_backend.loadbalancer.server.port=8000"
        - "traefik.docker.network=traefik-public"

  frontend:
    # 🚨 `:?` เช่นเดียวกับ backend (ดูข้อจำกัดของข้อความ error ที่หัวข้อ backend) — ห้าม fallback ไป `:latest`
    image: classroom-${ENV_NAME}-frontend:${IMAGE_TAG:?"IMAGE_TAG is required. Run pull_all.sh first"}
    networks:
      - traefik-public
    # 🚨 ต้องมี healthcheck — ไม่งั้นเกิด 502 ชั่วคราวทุกครั้งที่ deploy
    #    frontend ใช้ `order: start-first` ⇒ Swarm ถือว่า task ใหม่ "พร้อม" ทันทีที่สถานะเป็น
    #    running แล้ว **ฆ่า task เก่าทิ้ง** ทั้งที่ nginx ข้างในยังไม่ทันฟังพอร์ต 80
    #    ⇒ ช่วงเปลี่ยนผ่านมี task ที่ยังรับ request ไม่ได้ค้างอยู่หลัง Traefik = 502
    #    (backend รอดเพราะมี healthcheck อยู่แล้ว ⇒ Swarm รอ healthy จริงก่อนสลับ)
    #    วัดจริงตอน deploy 38ec9e6 (2026-09-25): เจอ 502 ~1 นาที บน class.singto1597.xyz
    #    ตรวจแล้วว่า `curl` มีติดมากับ image (nginx:alpine) และคืน 200 เมื่อ nginx พร้อม
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${ENV_NAME}_frontend.rule=Host(`${WEB_DOMAIN}`)"
        - "traefik.http.services.${ENV_NAME}_frontend.loadbalancer.server.port=80"
        - "traefik.docker.network=traefik-public"

  bot_discord:
    # 🚨 `:?` เช่นเดียวกับ backend (ดูข้อจำกัดของข้อความ error ที่หัวข้อ backend) — ห้าม fallback ไป `:latest`
    image: classroom-${ENV_NAME}-bot:${IMAGE_TAG:?"IMAGE_TAG is required. Run pull_all.sh first"}
    env_file:
      - .env
    environment:
      # 🚨 ต้องชี้ Redis instance เดียวกับ backend (ก่อนนี้ bot ไม่มี override นี้
      #    เลยเผลอไปฟัง staging_infra_redis ตัวเก่า → รับ event ไม่ได้)
      - REDIS_URL=redis://${ENV_NAME}_infra_redis:6379/0
    networks:
      - shared_network
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      rollback_config:
        parallelism: 1
        order: start-first

networks:
  traefik-public:
    external: true
  shared_network:
    name: app-internal-${ENV_NAME}
    external: true