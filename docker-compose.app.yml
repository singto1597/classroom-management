version: "3.8"

services:
  backend:
    image: classroom-${ENV_NAME}-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://${ENV_NAME}_infra_redis:6379/0
      # 🖨️ [F3] Gotenberg — service name จริงบน shared_network (ค่า default ใน config.py
      #    เป็น localhost ซึ่งใช้ได้แค่ตอนเทสต์ ⇒ ถ้าลืมบรรทัดนี้ PDF จะ 502 ทุกครั้ง)
      # ⚠️ stack name = DNS name ⇒ gotenberg ถูกย้ายไป stack `${ENV_NAME}_pdf` แล้ว
      #    (docker-compose.pdf.yml) จึงเป็น `..._pdf_gotenberg` ไม่ใช่ `..._infra_gotenberg`
      - GOTENBERG_URL=http://${ENV_NAME}_pdf_gotenberg:3000
    networks:
      - shared_network
      - traefik-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${ENV_NAME}_backend.rule=Host(`${API_DOMAIN}`)"
        - "traefik.http.services.${ENV_NAME}_backend.loadbalancer.server.port=8000"
        - "traefik.docker.network=traefik-public"

  frontend:
    image: classroom-${ENV_NAME}-frontend:${IMAGE_TAG:-latest}
    networks:
      - traefik-public
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${ENV_NAME}_frontend.rule=Host(`${WEB_DOMAIN}`)"
        - "traefik.http.services.${ENV_NAME}_frontend.loadbalancer.server.port=80"
        - "traefik.docker.network=traefik-public"

  bot_discord:
    image: classroom-${ENV_NAME}-bot:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      # 🚨 ต้องชี้ Redis instance เดียวกับ backend (ก่อนนี้ bot ไม่มี override นี้
      #    เลยเผลอไปฟัง staging_infra_redis ตัวเก่า → รับ event ไม่ได้)
      - REDIS_URL=redis://${ENV_NAME}_infra_redis:6379/0
    networks:
      - shared_network
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      rollback_config:
        parallelism: 1
        order: start-first

networks:
  traefik-public:
    external: true
  shared_network:
    name: app-internal-${ENV_NAME}
    external: true