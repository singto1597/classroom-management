# ============================================================
# CI · Compose
# ============================================================
#
# 🕳️ **ทำไมต้องมีไฟล์นี้:** workflow อีกสามตัวกรอง path แบบแคบ
#    (`backend/**`, `frontend/**`, `bot_discord/**`) ⇒ **การแก้ `docker-compose*.yml`
#    ไม่เคยถูกตรวจเลย** — PR #86 ที่เพิ่มกับดัก `${IMAGE_TAG:?...}` จึงไม่มี check วิ่ง
#    ทั้งที่เป็นคลาสของ change ที่แตะเส้นทาง deploy ตรง ๆ
#
# 📌 **ตรวจอย่างเดียว ไม่ deploy อะไรทั้งสิ้น** — ไม่ต้องมี secret ไม่ต้องมี network
#    ใช้เวลาไม่ถึง 10 วินาที (ต่างจาก ci-backend ที่ราว 45 นาที)
#
# 🎯 **เทสต์ที่สำคัญที่สุดคือ "กับดักต้องล้ม" ไม่ใช่ "compose ต้องผ่าน"**
#    เพราะกับดักนี้พังแบบ *เงียบ* ได้สองทาง ซึ่งทั้งคู่เคยเกิดขึ้นจริง (2026-09-26):
#      1. ลบ `${IMAGE_TAG:?...}` ออก ⇒ ถอยไปใช้ `:latest` ซึ่งอายุ 8 สัปดาห์
#      2. ใส่ขีด `-` ในข้อความ error ⇒ docker **ไม่ฟ้อง error** แต่ตัดที่ขีดตัวแรก
#         แล้วเอาข้อความข้างหลังไปเป็นชื่อ tag เงียบ ๆ (ดู docs/skills.md)
#    ⇒ สองข้อนี้จึงถูกบังคับด้วยเทสต์ ไม่ใช่ด้วยคอมเมนต์
name: CI · Compose

on:
  pull_request:
    paths:
      - 'docker-compose*.yml'
      # 🛡️ P6.4 — config ที่ถูก COPY เข้า image จริง (ไม่ใช่โค้ดที่ type-check จับได้)
      - 'frontend/nginx.default.conf'
      - 'frontend/nginx-security-headers.conf'
      - 'frontend/Dockerfile'
      - '.github/workflows/ci-compose.yml'
  push:
    branches: [main, staging]
    paths:
      - 'docker-compose*.yml'
      - 'frontend/nginx.default.conf'
      - 'frontend/nginx-security-headers.conf'
      - 'frontend/Dockerfile'
      - '.github/workflows/ci-compose.yml'

concurrency:
  group: ci-compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: ตรวจ compose + กับดัก IMAGE_TAG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # ① ตรวจโครงสร้างทุกไฟล์ — `--no-interpolate` ไม่แทนค่าตัวแปร
      #    ⇒ ผ่านได้โดยไม่ต้องรู้ค่าจริง และไม่ต้องมีความลับใน workflow
      - name: ตรวจโครงสร้าง compose ทุกไฟล์
        run: |
          set -euo pipefail
          fail=0
          for f in docker-compose*.yml; do
            if docker compose -f "$f" config --no-interpolate >/dev/null; then
              echo "✅ $f"
            else
              echo "❌ $f — YAML/โครงสร้างผิด"
              docker compose -f "$f" config --no-interpolate || true
              fail=1
            fi
          done
          exit $fail

      # ② กับดักต้องมีอยู่ และข้อความต้องไม่มีขีด `-`
      #    (ตรวจนอก docker เพื่อให้ได้ข้อความ error ที่อ่านรู้เรื่อง
      #     ไม่ใช่ "invalid interpolation format" ที่บอกอะไรไม่ได้)
      - name: กับดัก IMAGE_TAG ต้องอยู่ และข้อความต้องไม่มีขีด
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          # ⚠️ ต้องสแกน **เฉพาะบรรทัด `image:`** ไม่ใช่ทั้งไฟล์
          #    เพราะคอมเมนต์ในไฟล์นี้ยกตัวอย่าง `${IMAGE_TAG:?...}` ไว้ด้วย
          #    (สแกนทั้งไฟล์แล้วนับได้ 5 ทั้งที่กับดักจริงมี 4 — พลาดมาแล้วรอบหนึ่ง)
          #
          # 🔢 จำนวนนี้ **ตั้งใจให้ต้องอัปเดตมือเมื่อเพิ่ม service ที่ใช้ image**
          #    (เหมือน `test_route_count_is_not_silently_shrinking`) เพื่อให้คนเพิ่ม
          #    service ใหม่ได้ทบทวนว่า image ของตัวเองมีกับดัก `:?` ครบ
          EXPECTED_IMAGE_LINES = 4  # backend · frontend · bot_discord · push_worker (2026-11-01)

          lines = pathlib.Path('docker-compose.app.yml').read_text(encoding='utf-8').splitlines()
          img_lines = [l for l in lines if re.match(r'\s*image:', l)]

          if len(img_lines) != EXPECTED_IMAGE_LINES:
              print(
                  f"❌ บรรทัด `image:` มี {len(img_lines)} บรรทัด "
                  f"แต่ต้องมี {EXPECTED_IMAGE_LINES}"
              )
              print("   ถ้าเพิ่ม/ลบ service จริง ให้ปรับ EXPECTED_IMAGE_LINES ใน workflow นี้")
              for l in img_lines:
                  print(f"   {l.strip()}")
              sys.exit(1)

          msgs = []
          for l in img_lines:
              found = re.findall(r'\$\{IMAGE_TAG:\?([^}]*)\}', l)
              if not found:
                  print(f"❌ บรรทัดนี้ไม่มีกับดัก ⇒ ถอยไปใช้ค่า default ได้อีกแล้ว")
                  print(f"   {l.strip()}")
                  print("   default ในเครื่องนี้คือ ':latest' ซึ่งอายุ 8 สัปดาห์")
                  sys.exit(1)
              msgs += found

          bad = [m for m in msgs if '-' in m]
          if bad:
              print("❌ ข้อความ error มีเครื่องหมายขีด `-`")
              for b in bad:
                  print(f"   {b!r}")
              print("   ⇒ docker จะ *ไม่ฟ้อง error* แต่ตัดที่ขีดตัวแรก แล้วเอาข้อความ")
              print("      ข้างหลังไปเป็นชื่อ tag เงียบ ๆ = แย่กว่าไม่มีกับดัก")
              sys.exit(1)

          print(f"✅ กับดักครบ {len(msgs)} จุด และข้อความไม่มีขีด")
          print(f"   ตัวอย่าง: {msgs[0]}")
          PY

      # ③ ทดสอบพฤติกรรมจริงด้วย compose engine ตัวเดียวกับที่ production ใช้
      - name: กับดักต้องล้มดัง ๆ เมื่อไม่มี IMAGE_TAG
        run: |
          set -euo pipefail

          # `env_file: - .env` ใน compose ต้องมีไฟล์จริง ไม่งั้น render ล้มด้วยเหตุผลอื่น
          # สร้าง .env เปล่า — ไม่มีความลับใด ๆ ใน workflow นี้
          : > .env

          export ENV_NAME=ci
          export API_DOMAIN=ci-api.example.com
          export WEB_DOMAIN=ci-web.example.com

          # ⚠️ ต้องตั้ง IMAGE_TAG **ก่อน** probe — ถ้าไม่ตั้ง กับดักจะทำให้ probe ล้ม
          #    แล้วเราเข้าใจผิดว่า "runner ใช้ stack config ไม่ได้" (พลาดมาแล้วรอบหนึ่ง:
          #    บนเครื่องนี้ซึ่งเป็น swarm manager จริง ก็ยังถอยไปใช้ compose config เงียบ ๆ)
          #    ⇒ probe ที่ถูกต้องคือ "ลองตอนที่ทุกอย่างพร้อม" ถ้าผ่านแปลว่าใช้ได้จริง
          export IMAGE_TAG=ci00000

          # ใช้ `docker stack config` ให้ตรงกับที่ production ใช้ (`docker stack deploy`)
          # แต่ runner ของ GitHub ไม่ได้อยู่ใน swarm mode ⇒ ถ้าใช้ไม่ได้ให้ถอยไป
          # `docker compose config` ซึ่งใช้ compose-go ตัวเดียวกัน ⇒ กติกา `${VAR:?...}` เหมือนกัน
          if docker stack config -c docker-compose.app.yml >/dev/null 2>&1; then
            RENDER="docker stack config -c docker-compose.app.yml"
            echo "ℹ️ ใช้ docker stack config (ตรงกับ production)"
          else
            RENDER="docker compose -f docker-compose.app.yml config"
            echo "ℹ️ docker stack config ใช้ไม่ได้กับ runner นี้ — ถอยไปใช้ docker compose config"
            echo "   (บน runner ปกติจะเป็นเส้นทางนี้ — compose-go ตัวเดียวกันจึงได้ผลเท่ากัน)"
          fi

          # ③.๑ มี IMAGE_TAG ⇒ ต้อง render ผ่าน และ tag ต้องโผล่จริง
          $RENDER > /tmp/rendered.yml
          # ทุก service ที่ใช้ image ต้องติด tag เดียวกัน — เช็คทีละตัว ไม่ใช่แค่ "มีสักตัว"
          for svc in backend frontend bot; do
            if ! grep -qE "image: classroom-ci-${svc}:ci00000" /tmp/rendered.yml; then
              echo "❌ render ผ่านแต่ไม่พบ image ของ ${svc} ที่ติด tag ci00000:"
              grep -E 'image: classroom' /tmp/rendered.yml || true
              exit 1
            fi
          done
          # push_worker ใช้ image เดียวกับ backend ⇒ ต้อง render เป็น image เดียวกัน
          if [ "$(grep -cE 'image: classroom-ci-backend:ci00000' /tmp/rendered.yml)" -lt 2 ]; then
            echo "❌ push_worker ไม่ได้ใช้ image เดียวกับ backend"
            grep -E 'image: classroom' /tmp/rendered.yml || true
            exit 1
          fi
          echo "✅ มี IMAGE_TAG ⇒ render ผ่าน และติด tag ถูกต้อง"

          # ③.๒ ไม่มี IMAGE_TAG ⇒ ต้องล้ม (นี่คือตัวกันไม่ให้ถอยไป ':latest' เงียบ ๆ)
          unset IMAGE_TAG
          if $RENDER > /tmp/no-tag.yml 2>&1; then
            echo "❌ ไม่มี IMAGE_TAG แต่ render ผ่าน ⇒ กับดักหายไปแล้ว"
            echo "   ได้ image อะไร:"
            grep -E 'image: classroom' /tmp/no-tag.yml || true
            exit 1
          fi
          echo "✅ ไม่มี IMAGE_TAG ⇒ ล้มตามที่ควร"
          echo "   ข้อความที่ docker คืนมา:"
          head -2 /tmp/no-tag.yml | sed 's/^/     /'

      # ④ nginx security headers (P6.4) — ตรวจ "กับดักที่พังเงียบ" สองตัว:
      #    (ก) `add_header` ของ nginx **ไม่ merge** ระหว่างระดับ ⇒ location ที่ตั้ง
      #        Cache-Control จะทิ้ง security headers ทั้งชุดถ้าไม่ `include` เอง
      #        (ผลคือหน้า /assets/ ไม่มี CSP/nosniff แต่หน้า / มี — เห็นด้วยตายากมาก)
      #    (ข) `include` ไฟล์ที่ไม่ได้ COPY เข้า image ⇒ nginx start ไม่ขึ้น (crash-loop
      #        ตอน deploy) — ตรวจได้ฟรีตั้งแต่ตอนนี้ ไม่ต้องรอ production ล่ม
      - name: nginx security headers ต้องครบทุก location
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          conf_path = pathlib.Path('frontend/nginx.default.conf')
          hdr_path = pathlib.Path('frontend/nginx-security-headers.conf')
          dockerfile_path = pathlib.Path('frontend/Dockerfile')

          errors = []

          def fail(msg):
              errors.append(msg)

          # คอมเมนต์ในไฟล์เหล่านี้อธิบาย `add_header` ไว้ด้วย ⇒ ตัดทิ้งก่อนตรวจ
          # ไม่งั้นคอมเมนต์ที่เขียนว่า "ต้องมี nosniff" จะทำให้ด่านผ่านทั้งที่ของจริงหาย
          def code_of(path):
              return re.sub(r'#.*$', '', path.read_text(encoding='utf-8'), flags=re.M)

          for p in (conf_path, hdr_path, dockerfile_path):
              if not p.is_file():
                  print(f"❌ ไม่พบไฟล์ {p}")
                  sys.exit(1)

          conf = code_of(conf_path)
          hdr = code_of(hdr_path)
          dockerfile = dockerfile_path.read_text(encoding='utf-8')

          # ── ④.๑ ไฟล์ snippet ต้องประกาศ header ที่ต้องการ ด้วยค่าที่ถูกต้อง ──
          required = {
              'X-Content-Type-Options': r'nosniff',
              'X-Frame-Options': r'^DENY$',
              'Referrer-Policy': r'^strict-origin-when-cross-origin$',
              'Permissions-Policy': r'camera=\(self\)',
          }
          for name, pattern in required.items():
              m = re.search(rf'add_header\s+{re.escape(name)}\s+"([^"]*)"', hdr)
              if not m:
                  fail(f"ไม่มี header `{name}` ใน nginx-security-headers.conf")
              elif not re.search(pattern, m.group(1)):
                  fail(f"header `{name}` มีค่าไม่ตรงที่คาด: {m.group(1)!r}")

          # ── ④.๒ CSP ต้องเป็น report-only (ยังไม่บังคับ) และมี directive ครบ ──
          if re.search(r'add_header\s+Content-Security-Policy\s+"', hdr):
              fail(
                  "พบ `Content-Security-Policy` (บังคับใช้) — ขั้นนี้ตั้งใจให้เป็น "
                  "Report-Only ก่อน: ถ้าเปิดบังคับแล้วมี directive ขาด จะพังเฉพาะผู้ใช้จริง"
              )

          csp_match = re.search(
              r'add_header\s+Content-Security-Policy-Report-Only\s+"([^"]*)"', hdr
          )
          if not csp_match:
              fail("ไม่มี `Content-Security-Policy-Report-Only` ใน nginx-security-headers.conf")
              csp = ""
          else:
              csp = csp_match.group(1)

          for directive, value in {
              'default-src': "'self'",
              'script-src': "'self'",
              'frame-ancestors': "'none'",
              'object-src': "'none'",
              'base-uri': "'self'",
              'form-action': "'self'",
              'worker-src': "'self'",
              'manifest-src': "'self'",
          }.items():
              if not re.search(rf"(?:^|;)\s*{directive}\s+{re.escape(value)}\s*(?:;|$)", csp):
                  fail(f"CSP ขาด `{directive} {value}`")

          # API อยู่คนละ subdomain — ถ้าไม่อยู่ใน connect-src ทุกคำขอ API จะถูกรายงาน
          # (report-only จึงไม่พัง แต่รายงานจะท่วมจนดูของจริงไม่ออก)
          if 'connect-src' not in csp or 'https://classapi.singto1597.xyz' not in csp:
              fail("CSP `connect-src` ต้องมี https://classapi.singto1597.xyz (production API)")

          # ── ④.๓ `server_tokens off` ──
          if not re.search(r'^\s*server_tokens\s+off\s*;', conf, re.M):
              fail("nginx.default.conf ขาด `server_tokens off;` (ไม่ปิดเวอร์ชัน nginx)")

          # ── ④.๔ ทุก `location` และ `server` ต้อง include snippet (กับดัก add_header) ──
          def blocks(code, keyword):
              """คืน (หัวบล็อก, เนื้อในรวมปีกกา) ของทุก `keyword … { … }`"""
              for m in re.finditer(rf'\b{keyword}\b[^{{]*\{{', code):
                  depth = 0
                  i = m.end() - 1
                  while i < len(code):
                      if code[i] == '{':
                          depth += 1
                      elif code[i] == '}':
                          depth -= 1
                          if depth == 0:
                              break
                      i += 1
                  else:
                      yield m.group(0).strip(), code[m.end():]   # ไม่เจอปีกกาปิด — ให้ด่านอื่นฟ้อง
                      continue
                  yield m.group(0).strip(), code[m.end():i]

          include_path = '/etc/nginx/snippets/security-headers.conf'
          server_blocks = list(blocks(conf, 'server'))
          if not server_blocks:
              fail("ไม่พบ `server {}` ใน nginx.default.conf")
          for head, body in server_blocks:
              if include_path not in body:
                  fail(f"`server {{}}` ไม่ได้ include {include_path}")

          location_blocks = list(blocks(conf, 'location'))
          # 🔢 ตั้งใจให้ต้องอัปเดตมือเมื่อเพิ่ม location — เพื่อให้คนเพิ่มได้ทบทวนว่า
          #    location ใหม่มี `add_header` ของตัวเองหรือไม่ (ถ้ามี ต้อง include ด้วย)
          EXPECTED_LOCATIONS = 4  # /sw.js · /manifest.webmanifest · /assets/ · /
          if len(location_blocks) != EXPECTED_LOCATIONS:
              fail(
                  f"พบ `location` {len(location_blocks)} บล็อก แต่คาดไว้ {EXPECTED_LOCATIONS} — "
                  "ถ้าเพิ่ม/ลบจริง ให้ปรับ EXPECTED_LOCATIONS และ include snippet ในของใหม่"
              )
          for head, body in location_blocks:
              if include_path not in body:
                  fail(f"`{head}` ไม่ได้ include {include_path} ⇒ location นี้จะทิ้ง security headers")

          # ── ④.๕ Dockerfile ต้อง COPY snippet ไปที่ path ที่ include ไว้ ──
          if 'nginx-security-headers.conf' not in dockerfile:
              fail("Dockerfile ไม่ได้ COPY nginx-security-headers.conf (nginx จะ start ไม่ขึ้น)")
          elif not re.search(
              r'COPY\s+nginx-security-headers\.conf\s+' + re.escape(include_path), dockerfile
          ):
              fail(
                  "Dockerfile COPY ไฟล์ security headers ไปไม่ตรง path ที่ include ไว้ "
                  f"({include_path}) — nginx จะ start ไม่ขึ้น"
              )

          if errors:
              print("❌ nginx security headers ไม่ครบ:")
              for e in errors:
                  print(f"   • {e}")
              sys.exit(1)

          print("✅ nginx security headers ครบ")
          print(f"   include {len(location_blocks)} location + {len(server_blocks)} server block")
          print(f"   CSP report-only ยาว {len(csp)} ตัวอักษร · ยังไม่บังคับใช้")
          PY

      - name: เก็บกวาด
        if: always()
        run: rm -f .env /tmp/rendered.yml /tmp/no-tag.yml
