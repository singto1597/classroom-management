name: Auto Deploy Web PHP
on:
  push:
    branches: [ main, staging ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Server and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
              echo "🚀 Deploying Web PHP STAGING..."
              cd ~/classroom-staging/classroom-management_web-announcement_php
              git pull origin staging

            elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "🔥 Deploying Web PHP PRODUCTION..."
              cd ~/classroom-management/classroom-management_web-announcement_php
              git pull origin main
            fi
